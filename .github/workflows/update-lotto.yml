name: 회차 결과 자동 갱신

# 토요일 20:35 KST 추첨 직후 결과가 최대한 빨리 lotto-results.json에 올라오게 한다.
# KST는 UTC+9 — 토요일 11:40 · 11:45 · 11:55 · 12:10 UTC
#   = 20:40 · 20:45 · 20:55 · 21:10 KST. 추첨 직후 결과가 늦게 올라오는 날을 대비해 네 번 건다.
# 먼저 성공한 실행이 새 회차를 커밋하면, 뒤에 도는 실행은 "이미 최신"으로 보고 바로 끝난다
# (scripts/update-lotto.py 의 최신 여부 확인 — 커밋 없이 수십 초 안에 종료).
on:
  schedule:
    - cron: '40 11 * * 6'
    - cron: '45 11 * * 6'
    - cron: '55 11 * * 6'
    - cron: '10 12 * * 6'
  workflow_dispatch:

permissions:
  contents: write

# 예약 실행이 겹쳐도 한 번에 하나만 돈다(뒤 실행은 큐에서 기다렸다가 최신 여부를 확인한다).
concurrency:
  group: lotto-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 최신 회차 받아 lotto-results.json 갱신
        env:
          MONG_PICK_WAIT: '180'        # 결과가 아직 없으면 3분 간격으로 다시 본다
          MONG_PICK_NET_RETRY: '20'    # 동행복권 API가 응답을 늦게/못 줄 때 다시 보는 간격(초)
          # 정기 실행은 결과가 늦게 올라올 수 있어 최대 4번(약 9분) 확인하고,
          # 손으로 돌릴 때는 한 번만 본다(이미 최신이면 어느 쪽이든 바로 끝난다).
          MONG_PICK_TRIES: ${{ github.event_name == 'schedule' && '4' || '1' }}
        run: python3 scripts/update-lotto.py

      - name: 바뀐 게 있으면 커밋
        run: |
          if [ -z "$(git status --porcelain lotto-results.json)" ]; then
            echo "새 회차 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git config user.name "mongpick-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lotto-results.json
          git commit -m "chore: 회차 결과 자동 갱신 ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase --autostash origin main
          git push
